<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            display: block;
            background: #e9c46a;
            padding: 10px;
            margin-bottom: 20px;
        }
        .inline {
            display: inline;
            background: #f4a261;
            padding: 10px;
            margin-right: 20px;
        }
        .inline-block {
            display: inline-block;
            background: #254653;
            color: white;
            width: 150px;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="block">Block Element</div>
    <span class="inline"> Inline Element</span>
    <span class="inline">Another Element</span>
    <div Inline-Block class="inline block">Inline-Block</div>
    
</body>
</html>
