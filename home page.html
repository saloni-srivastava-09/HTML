<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Sidebar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial,sans-serif;
            background-color: #f0f4f8; }
            header{
                background-color: #0077cc;
                color: white;
                text-align: center;
                padding: 20px 0; }
                .sidebar {
                    position: fixed;
                top: 0;
                left: 0;
                height: 100%;    width: 200px;
                background-color: #005fa3;
                padding-top: 60px;
                display: flex;
                flex-direction: column;
                align-items: center; }
                .sidebar a{
                    display: block;
                    color: white;
                    text-decoration: none;
                    padding: 12px 0;  width: 100%;
                    text-align: center;
                    font-weight: bold; }
                    .sidebar a:hover{
                        background-color: #0077cc; }
                        .content {
                            margin-left: 200px;
                            padding: 20px; }
                            .content h1 {
                                color:#333;
                                    font-size: 36px; }
                                    .content p {
                                        font-size: 18px;
                                        color: #555;
                                        max-width: 700px;
                                        line-height: 1.6; }
                                        footer{
                                            background-color: #0077cc;
                                            color: white;
                                            text-align: center;
                                            padding: 15px 0;  position:fixed;
                                            bottom: 0;
                                            left: 200px;
                                            width: calc(100%-200px);}
                                            @media(max-width: 700px) {
                                            .sidebar{
                                                width: 150px;   }
                                                .content{
                                                    margin-left: 150px;  }
                                                    .content h1 {
                                                        font-size: 28px; }
                                                            .content p {
                                                                font-size: 16px; }
                                                                footer {
                                                                    left: 150px;
                                                                    width:calc(100%-150px);
                                                                    }
                                                                }
    </style>
</head> 
<body>
  <header>
    <h1>Welcome to My Website</h1>
  </header>  
  <div class="sidebar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  <div class="content"> <h1>Discover Something Amazing!</h1> </div>
  <footer> THANK YOU </footer>
</body>
</html>
